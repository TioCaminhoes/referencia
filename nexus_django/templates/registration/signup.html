{% extends 'base.html' %}{% block title %}Criar conta — Nexus{% endblock %}{% block content %}<section class="auth"><div class="auth-box"><span class="eyebrow">COMECE AGORA</span><h1>Criar conta.</h1><form method="post" class="form-card">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.errors %}<small class="error">{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}<button class="btn primary">Criar minha conta →</button></form><p>Já possui conta? <a href="{% url 'login' %}">Entrar</a></p></div></section>{% endblock %}
